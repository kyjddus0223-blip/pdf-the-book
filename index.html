<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScanBook AI - 스마트 디지털 텍스트 & PDF 변환기</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a'
            }
          }
        }
      }
    }
  </script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Marked (Markdown Parser) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- html2pdf.js for Client-Side PDF Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    /* Custom PDF Design Template */
    .pdf-template {
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      color: #1e293b;
      line-height: 1.6;
      background-color: #ffffff;
      padding: 40px;
      width: 800px;
      margin: 0 auto;
    }
    .pdf-template h1 {
      font-size: 26px;
      font-weight: 800;
      color: #1e3a8a;
      border-bottom: 3px solid #1e3a8a;
      padding-bottom: 8px;
      margin-top: 0;
      margin-bottom: 16px;
    }
    .pdf-template h2 {
      font-size: 18px;
      font-weight: 700;
      color: #1d4ed8;
      background-color: #eff6ff;
      padding: 8px 14px;
      border-left: 5px solid #2563eb;
      border-radius: 0 6px 6px 0;
      margin-top: 24px;
      margin-bottom: 12px;
    }
    .pdf-template h3 {
      font-size: 15px;
      font-weight: 700;
      color: #1e40af;
      margin-top: 16px;
      margin-bottom: 8px;
    }
    .pdf-template p {
      margin-bottom: 10px;
      font-size: 13.5px;
      word-break: keep-all;
    }
    .pdf-template ul, .pdf-template ol {
      margin-bottom: 12px;
      padding-left: 20px;
      font-size: 13.5px;
    }
    .pdf-template li {
      margin-bottom: 4px;
    }
    .pdf-template table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 12.5px;
    }
    .pdf-template th {
      background-color: #f1f5f9;
      color: #334155;
      font-weight: 700;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      text-align: left;
    }
    .pdf-template td {
      padding: 7px 12px;
      border: 1px solid #cbd5e1;
    }
    .pdf-template mark {
      background-color: #fef08a;
      color: #854d0e;
      padding: 2px 5px;
      border-radius: 3px;
      font-weight: 600;
    }
    .pdf-template blockquote {
      border-left: 4px solid #94a3b8;
      background-color: #f8fafc;
      padding: 10px 14px;
      margin: 12px 0;
      color: #475569;
      font-size: 13px;
    }
    .pdf-template code {
      background-color: #f1f5f9;
      color: #0f172a;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-brand-500 selection:text-white">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-brand-600 rounded-xl shadow-lg shadow-brand-500/20">
          <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-none">ScanBook AI</h1>
          <p class="text-xs text-slate-400 mt-1">스캔 사진 ➔ 깔끔한 디지털 텍스트 & PDF 변환</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <button onclick="openApiModal()" class="px-3 py-1.5 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 flex items-center gap-1.5 transition">
          <i data-lucide="key" class="w-3.5 h-3.5"></i>
          <span>API 키 설정</span>
        </button>
        <button onclick="downloadPDF()" class="px-4 py-2 text-xs font-semibold bg-brand-600 hover:bg-brand-500 text-white rounded-lg shadow-md shadow-brand-600/30 flex items-center gap-2 transition">
          <i data-lucide="file-down" class="w-4 h-4"></i>
          <span>완성된 PDF 다운로드</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Grid -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-2 gap-6">

    <!-- Left Panel: Input & OCR -->
    <section class="flex flex-col gap-4">
      
      <!-- Upload Box -->
      <div class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-4">
        <h2 class="text-sm font-semibold text-slate-300 mb-3 flex items-center gap-2">
          <i data-lucide="image" class="w-4 h-4 text-brand-500"></i>
          <span>1. 책 스캔 사진 업로드</span>
        </h2>

        <div id="drop-zone" class="border-2 border-dashed border-slate-700 hover:border-brand-500/80 bg-slate-900/50 rounded-xl p-6 text-center cursor-pointer transition flex flex-col items-center justify-center min-h-[160px] relative overflow-hidden group">
          <input type="file" id="file-input" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer z-10" onchange="handleFileSelect(event)">
          
          <div id="upload-placeholder" class="flex flex-col items-center">
            <div class="p-3 bg-slate-800 rounded-full mb-2 group-hover:scale-110 transition">
              <i data-lucide="upload-cloud" class="w-6 h-6 text-slate-400 group-hover:text-brand-400"></i>
            </div>
            <p class="text-xs font-medium text-slate-300">클릭하거나 책 사진을 여기에 드래그하세요</p>
            <p class="text-[11px] text-slate-500 mt-1">PNG, JPG, WEBP 지원</p>
          </div>

          <img id="image-preview" class="hidden max-h-48 rounded-lg object-contain border border-slate-700" alt="스캔본 미리보기">
        </div>

        <div class="mt-3 flex gap-2">
          <button onclick="runOCR()" id="btn-ocr" class="flex-1 py-2.5 bg-brand-600 hover:bg-brand-500 disabled:bg-slate-700 text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition shadow-lg shadow-brand-600/20">
            <i data-lucide="wand2" class="w-4 h-4"></i>
            <span>AI 텍스트 & 표 추출 실행</span>
          </button>
          <button onclick="loadSample()" class="px-3 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-medium border border-slate-700">
            샘플 데이터
          </button>
        </div>
      </div>

      <!-- Editor Box -->
      <div class="flex-1 bg-slate-800/50 border border-slate-700/60 rounded-2xl p-4 flex flex-col min-h-[350px]">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-sm font-semibold text-slate-300 flex items-center gap-2">
            <i data-lucide="edit-3" class="w-4 h-4 text-brand-500"></i>
            <span>2. 추출 내용 수정 (마크다운 에디터)</span>
          </h2>
          <span class="text-[11px] text-slate-400">수정 내용이 우측 미리보기에 실시간 반영됩니다</span>
        </div>

        <textarea id="markdown-input" oninput="updatePreview()" class="w-full flex-1 bg-slate-900 border border-slate-700/80 rounded-xl p-3.5 text-xs text-slate-200 font-mono resize-none focus:outline-none focus:border-brand-500 leading-relaxed" placeholder="사진을 올리고 [AI 텍스트 & 표 추출]을 누르시거나, 여기에 직접 입력해 보세요..."></textarea>
      </div>

    </section>

    <!-- Right Panel: PDF Preview -->
    <section class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-4 flex flex-col h-full overflow-hidden">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-semibold text-slate-300 flex items-center gap-2">
          <i data-lucide="eye" class="w-4 h-4 text-brand-500"></i>
          <span>3. 디지털 PDF 실시간 미리보기</span>
        </h2>
        <span class="text-[11px] bg-brand-500/10 text-brand-400 px-2.5 py-0.5 rounded-full border border-brand-500/20 font-medium">전공 요약본 템플릿 적용됨</span>
      </div>

      <!-- PDF Canvas Container -->
      <div class="flex-1 bg-slate-950 rounded-xl p-4 overflow-y-auto flex justify-center border border-slate-800">
        <div id="pdf-container" class="pdf-template shadow-2xl rounded-sm">
          <!-- Rendered HTML Content Goes Here -->
        </div>
      </div>
    </section>

  </main>

  <!-- API Key Modal -->
  <div id="api-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-slate-100 flex items-center gap-2">
          <i data-lucide="key" class="w-4 h-4 text-brand-500"></i>
          <span>Gemini API 키 등록</span>
        </h3>
        <button onclick="closeApiModal()" class="text-slate-400 hover:text-slate-200">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <p class="text-xs text-slate-400 mb-4 leading-relaxed">
        사진 속 글자, 표, 수식을 AI가 정밀 파악하여 디지털 텍스트로 전환하기 위해 Google Gemini API 키가 필요합니다. (무료 발급 가능)
      </p>

      <input type="password" id="api-key-input" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-slate-200 mb-4 focus:outline-none focus:border-brand-500" placeholder="AIzaSy...">

      <div class="flex gap-2">
        <button onclick="saveApiKey()" class="flex-1 py-2.5 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-xs font-semibold transition">
          저장하기
        </button>
        <a href="https://aistudio.google.com/app/apikey" target="_blank" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-medium border border-slate-700 flex items-center gap-1">
          <span>키 무료 발급</span>
          <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
        </a>
      </div>
    </div>
  </div>

  <script>
    // State
    let currentImageBase64 = null;
    let apiKey = localStorage.getItem('scanbook_gemini_key') || '';

    // Init Icons
    lucide.createIcons();

    // Default Sample Markdown
    const sampleMarkdown = `# 열역학 제3장: 밀폐계 에너지 해석
**지정 연습문제 워크북 (Practice Workbook)** | 대상 장: 제3장 (Closed Systems)

## Part 1. 필수 공식 요약집
### 제3장 핵심 수식 및 공식 참고표

1. 경계일 (Boundary Work, W_b)
- 기본 정의: W_b = ∫ P dV
- 등압 과정 (P = const): W_b = P(V_2 - V_1) = mR(T_2 - T_1)
- 등온 과정 (T = const): W_b = P_1 V_1 ln(V_2/V_1) = mRT ln(P_1/P_2)

2. 열역학 제1법칙 (밀폐계)
- 에너지 보존: <mark>Q_in - W_out = ΔE_system</mark>
- 정지계 (ΔKE = ΔPE = 0): Q - W = ΔU = m(u_2 - u_1)
- 단위 질량당 식: q - w = Δu

| 열역학 과정 (Process) | 상태 방정식 / 조건 | 경계일 (W_b) 계산 수식 | 특징 및 비고 |
| :--- | :--- | :--- | :--- |
| **정적 과정 (Isochoric)** | V = const (dV = 0) | W_b = 0 | 경계 이동이 없으므로 일 = 0 |
| **등압 과정 (Isobaric)** | P = const | W_b = P (V_2 - V_1) | 피스톤 자유 이동, Q = ΔH |
| **등온 과정 (Isothermal)** | T = const (PV = const) | W_b = P_1 V_1 ln(V_2 / V_1) | 이상기체의 경우 ΔU = 0 |
`;

    document.getElementById('markdown-input').value = sampleMarkdown;
    updatePreview();

    if (apiKey) {
      document.getElementById('api-key-input').value = apiKey;
    }

    // Modal Control
    function openApiModal() { document.getElementById('api-modal').classList.remove('hidden'); }
    function closeApiModal() { document.getElementById('api-modal').classList.add('hidden'); }
    function saveApiKey() {
      const val = document.getElementById('api-key-input').value.trim();
      if (val) {
        apiKey = val;
        localStorage.setItem('scanbook_gemini_key', apiKey);
        alert('API 키가 저장되었습니다.');
        closeApiModal();
      }
    }

    // File Handling
    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        currentImageBase64 = e.target.result;
        const imgEl = document.getElementById('image-preview');
        imgEl.src = currentImageBase64;
        imgEl.classList.remove('hidden');
        document.getElementById('upload-placeholder').classList.add('hidden');
      };
      reader.readAsDataURL(file);
    }

    // Live Preview
    function updatePreview() {
      const text = document.getElementById('markdown-input').value;
      const htmlContent = marked.parse(text);
      document.getElementById('pdf-container').innerHTML = htmlContent;
    }

    // Sample Loader
    function loadSample() {
      document.getElementById('markdown-input').value = sampleMarkdown;
      updatePreview();
    }

    // Gemini Vision OCR Call
    async function runOCR() {
      if (!currentImageBase64) {
        alert('스캔한 사진을 먼저 업로드해 주세요.');
        return;
      }
      if (!apiKey) {
        openApiModal();
        alert('AI 텍스트 추출을 위해 Gemini API 키를 먼저 입력해 주세요.');
        return;
      }

      const btn = document.getElementById('btn-ocr');
      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>AI 분석 중...</span>`;
      lucide.createIcons();

      try {
        const base64Data = currentImageBase64.split(',')[1];
        const promptText = `사진 속 문서를 한국어 마크다운(Markdown) 형식으로 완벽하게 디지털 복원해 줘.
- 제목은 #, 소제목은 ##, ### 사용
- 표(Table)는 마크다운 표 형식 (| | |)으로 작성
- 중요한 수식이나 핵심 키워드는 <mark>내용</mark> 태그로 감싸기
- 불필요한 인쇄 잡음이나 손가락은 제외하고 순수 본문 텍스트 및 수식만 추출할 것`;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: promptText },
                { inline_data: { mime_type: "image/jpeg", data: base64Data } }
              ]
            }]
          })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          const resultMd = data.candidates[0].content.parts[0].text;
          document.getElementById('markdown-input').value = resultMd;
          updatePreview();
        } else {
          alert('텍스트를 추출하지 못했습니다. 이미지 화질을 확인해 주세요.');
        }
      } catch (err) {
        console.error(err);
        alert('AI 분석 중 오류가 발생했습니다. API 키 또는 네트워크 상태를 확인하세요.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="wand2" class="w-4 h-4"></i><span>AI 텍스트 & 표 추출 실행</span>`;
        lucide.createIcons();
      }
    }

    // PDF Download
    function downloadPDF() {
      const element = document.getElementById('pdf-container');
      const opt = {
        margin:       10,
        filename:     'ScanBook_Digital_Summary.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(element).save();
    }
  </script>
</body>
</html>
