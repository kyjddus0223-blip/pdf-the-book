<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScanBook AI - 스마트 디지털 텍스트 & PDF 변환기</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a' } } } } }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    .pdf-template { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; color: #1e293b; line-height: 1.6; background-color: #ffffff; padding: 40px; width: 800px; margin: 0 auto; }
    .pdf-template h1 { font-size: 26px; font-weight: 800; color: #1e3a8a; border-bottom: 3px solid #1e3a8a; padding-bottom: 8px; margin-top: 0; margin-bottom: 16px; }
    .pdf-template h2 { font-size: 18px; font-weight: 700; color: #1d4ed8; background-color: #eff6ff; padding: 8px 14px; border-left: 5px solid #2563eb; border-radius: 0 6px 6px 0; margin-top: 24px; margin-bottom: 12px; }
    .pdf-template h3 { font-size: 15px; font-weight: 700; color: #1e40af; margin-top: 16px; margin-bottom: 8px; }
    .pdf-template p { margin-bottom: 10px; font-size: 13.5px; word-break: keep-all; }
    .pdf-template ul, .pdf-template ol { margin-bottom: 12px; padding-left: 20px; font-size: 13.5px; }
    .pdf-template li { margin-bottom: 4px; }
    .pdf-template table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 12.5px; }
    .pdf-template th { background-color: #f1f5f9; color: #334155; font-weight: 700; padding: 8px 12px; border: 1px solid #cbd5e1; text-align: left; }
    .pdf-template td { padding: 7px 12px; border: 1px solid #cbd5e1; }
    .pdf-template mark { background-color: #fef08a; color: #854d0e; padding: 2px 5px; border-radius: 3px; font-weight: 600; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-brand-500 selection:text-white">

  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-brand-600 rounded-xl shadow-lg">
          <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-none">ScanBook AI</h1>
          <p class="text-xs text-slate-400 mt-1">스캔 사진 ➔ 깔끔한 디지털 텍스트 & PDF 변환</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openApiModal()" class="px-3 py-1.5 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 flex items-center gap-1.5 transition">
          <i data-lucide="key" class="w-3.5 h-3.5"></i><span>API 키 설정</span>
        </button>
        <button onclick="downloadPDF()" class="px-4 py-2 text-xs font-semibold bg-brand-600 hover:bg-brand-500 text-white rounded-lg flex items-center gap-2 transition">
          <i data-lucide="file-down" class="w-4 h-4"></i><span>완성된 PDF 다운로드</span>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-2 gap-6">
    <section class="flex flex-col gap-4">
      <div class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-4">
        <h2 class="text-sm font-semibold text-slate-300 mb-3 flex items-center gap-2">
          <i data-lucide="image" class="w-4 h-4 text-brand-500"></i><span>1. 책 스캔 사진 업로드</span>
        </h2>
        <div id="drop-zone" class="border-2 border-dashed border-slate-700 bg-slate-900/50 rounded-xl p-6 text-center relative overflow-hidden flex flex-col items-center justify-center min-h-[160px]">
          <input type="file" id="file-input" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer z-10" onchange="handleFileSelect(event)">
          <div id="upload-placeholder" class="flex flex-col items-center">
            <i data-lucide="upload-cloud" class="w-6 h-6 text-slate-400 mb-2"></i>
            <p class="text-xs font-medium text-slate-300">클릭하거나 사진을 드래그하세요</p>
          </div>
          <img id="image-preview" class="hidden max-h-48 rounded-lg object-contain border border-slate-700" alt="미리보기">
        </div>
        <div class="mt-3 flex gap-2">
          <button onclick="runOCR()" id="btn-ocr" class="flex-1 py-2.5 bg-brand-600 hover:bg-brand-500 disabled:bg-slate-700 text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition">
            <i data-lucide="wand2" class="w-4 h-4"></i><span>AI 텍스트 & 표 추출 실행</span>
          </button>
        </div>
      </div>

      <div class="flex-1 bg-slate-800/50 border border-slate-700/60 rounded-2xl p-4 flex flex-col min-h-[350px]">
        <h2 class="text-sm font-semibold text-slate-300 mb-3 flex items-center gap-2">
          <i data-lucide="edit-3" class="w-4 h-4 text-brand-500"></i><span>2. 추출 내용 수정</span>
        </h2>
        <textarea id="markdown-input" oninput="updatePreview()" class="w-full flex-1 bg-slate-900 border border-slate-700/80 rounded-xl p-3.5 text-xs text-slate-200 font-mono resize-none focus:outline-none focus:border-brand-500" placeholder="추출된 텍스트가 여기에 표시됩니다..."></textarea>
      </div>
    </section>

    <section class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-4 flex flex-col h-full overflow-hidden">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-semibold text-slate-300 flex items-center gap-2">
          <i data-lucide="eye" class="w-4 h-4 text-brand-500"></i><span>3. 실시간 미리보기</span>
        </h2>
      </div>
      <div class="flex-1 bg-slate-950 rounded-xl p-4 overflow-y-auto flex justify-center border border-slate-800">
        <div id="pdf-container" class="pdf-template shadow-2xl rounded-sm"></div>
      </div>
    </section>
  </main>

  <div id="api-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-slate-100">Gemini API 키 등록</h3>
        <button onclick="closeApiModal()" class="text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <input type="password" id="api-key-input" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-slate-200 mb-4 focus:border-brand-500" placeholder="AIzaSy...">
      <div class="flex gap-2">
        <button onclick="saveApiKey()" class="flex-1 py-2.5 bg-brand-600 text-white rounded-xl text-xs font-semibold">저장하기</button>
      </div>
    </div>
  </div>

  <script>
    let currentImageBase64 = null;
    let apiKey = localStorage.getItem('scanbook_gemini_key') || '';
    lucide.createIcons();

    if (apiKey) document.getElementById('api-key-input').value = apiKey;
    function openApiModal() { document.getElementById('api-modal').classList.remove('hidden'); }
    function closeApiModal() { document.getElementById('api-modal').classList.add('hidden'); }
    function saveApiKey() {
      const val = document.getElementById('api-key-input').value.trim();
      if (val) { apiKey = val; localStorage.setItem('scanbook_gemini_key', apiKey); alert('저장 완료!'); closeApiModal(); }
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      const img = new Image();
      const reader = new FileReader();
      reader.onload = function(e) {
        img.src = e.target.result;
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 1200; // 용량 초과 방지용 리사이징 최적화
          let width = img.width, height = img.height;
          if (width > maxDim || height > maxDim) {
            if (width > height) { height = Math.round((height * maxDim) / width); width = maxDim; } 
            else { width = Math.round((width * maxDim) / height); height = maxDim; }
          }
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          currentImageBase64 = canvas.toDataURL('image/jpeg', 0.85);
          document.getElementById('image-preview').src = currentImageBase64;
          document.getElementById('image-preview').classList.remove('hidden');
          document.getElementById('upload-placeholder').classList.add('hidden');
        };
      };
      reader.readAsDataURL(file);
    }

    function updatePreview() {
      document.getElementById('pdf-container').innerHTML = marked.parse(document.getElementById('markdown-input').value);
    }

    async function runOCR() {
      if (!currentImageBase64) return alert('사진을 올려주세요.');
      if (!apiKey) return openApiModal();

      const btn = document.getElementById('btn-ocr');
      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>AI 분석 중...</span>`;
      lucide.createIcons();

      // ★ 오류 해결의 핵심: 가능한 모든 모델을 순서대로 시도하는 자동 폴백 루프
      const fallbackModels = [
        'gemini-1.5-flash',
        'gemini-1.5-pro',
        'gemini-1.5-flash-8b',
        'gemini-pro-vision',
        'gemini-1.0-pro-vision'
      ];
      
      const base64Data = currentImageBase64.split(',')[1];
      const promptText = "첨부된 책/문서 이미지의 텍스트, 수식, 표를 마크다운(Markdown) 형식으로 최대한 정확하게 추출해줘. 문서의 큰 제목은 #, 소제목은 ##를 사용하고, 강조할 수식이나 핵심 단어는 <mark>내용</mark> 태그로 감싸줘. 표는 반드시 마크다운 테이블 형식(| |)으로 변환해줘.";
      
      let successData = null;
      let lastErrorMessage = '';

      for (const model of fallbackModels) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: promptText }, { inline_data: { mime_type: "image/jpeg", data: base64Data } }] }]
            })
          });
          const data = await res.json();
          if (res.ok && !data.error) {
            successData = data;
            break; // 작동하는 모델을 찾으면 즉시 중단하고 넘어감
          } else {
            lastErrorMessage = data.error?.message || '알 수 없는 오류';
          }
        } catch (e) {
          lastErrorMessage = e.message;
        }
      }

      if (successData && successData.candidates && successData.candidates[0].content) {
        document.getElementById('markdown-input').value = successData.candidates[0].content.parts[0].text;
        updatePreview();
      } else {
        alert(`분석 실패. API 키의 할당량이 초과되었거나 사용 제한 상태입니다.\n\n상세 오류: ${lastErrorMessage}`);
      }

      btn.disabled = false;
      btn.innerHTML = `<i data-lucide="wand2" class="w-4 h-4"></i><span>AI 텍스트 & 표 추출 실행</span>`;
      lucide.createIcons();
    }

    function downloadPDF() {
      html2pdf().set({
        margin: 10, filename: 'ScanBook_Digital.pdf',
        image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      }).from(document.getElementById('pdf-container')).save();
    }
  </script>
</body>
</html>
