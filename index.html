<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScanBook Studio - 스캔 사진 묶음 PDF 변환기</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#131e32',
                            950: '#070d18'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- jsPDF Library for High-Quality Image PDF Bundling -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.5); }

        .checker-bg {
            background-color: #0f172a;
            background-image: linear-gradient(45deg, #1e293b 25%, transparent 25%),
                              linear-gradient(-45deg, #1e293b 25%, transparent 25%),
                              linear-gradient(45deg, transparent 75%, #1e293b 75%),
                              linear-gradient(-45deg, transparent 75%, #1e293b 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Navigation Bar -->
    <header class="h-16 border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-40 flex items-center justify-between px-4 sm:px-6">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-violet-600 to-emerald-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                <i data-lucide="file-check-2" class="w-6 h-6 text-white"></i>
            </div>
            <div>
                <h1 class="font-bold text-base sm:text-lg leading-tight text-white flex items-center gap-2">
                    ScanBook Studio
                    <span class="text-[10px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded-full font-normal">방식 1: 보정 이미지 묶음 PDF</span>
                </h1>
                <p class="text-xs text-slate-400">사진 보정 & 그림·수식 100% 보존 PDF 제작</p>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center space-x-2">
            <button onclick="loadSampleScanBook()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-xs font-medium transition flex items-center space-x-1.5">
                <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-400"></i>
                <span class="hidden sm:inline">샘플 불러오기</span>
            </button>

            <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1.5">
                <i data-lucide="plus" class="w-4 h-4 text-indigo-400"></i>
                <span>사진 추가</span>
                <input type="file" id="file-input" multiple accept="image/*" class="hidden" onchange="handleFileUpload(event)">
            </label>

            <button onclick="exportToPdfBundle()" class="bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white px-4 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition shadow-lg shadow-indigo-600/30 flex items-center space-x-2">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span>PDF 내보내기</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace Layout -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <!-- LEFT PANEL: Page Navigation & Thumbnails Bar -->
        <div class="w-full md:w-72 border-r border-slate-800 bg-slate-900/70 flex flex-col h-auto md:h-full shrink-0">
            <div class="p-3 border-b border-slate-800 flex items-center justify-between text-xs text-slate-400 font-medium">
                <span class="flex items-center space-x-1.5 text-slate-200 font-semibold">
                    <i data-lucide="layers" class="w-4 h-4 text-indigo-400"></i>
                    <span>페이지 순서 (<span id="total-page-count">0</span>장)</span>
                </span>
                <button onclick="clearAllPages()" class="hover:text-rose-400 text-[11px] transition">전체 삭제</button>
            </div>

            <!-- Page Thumbnails List -->
            <div id="thumbnail-list" class="flex-1 overflow-y-auto p-3 space-y-2.5 max-h-48 md:max-h-none">
                <!-- Page item cards rendered dynamically -->
            </div>

            <!-- Drag & Drop Upload Zone -->
            <div class="p-3 border-t border-slate-800 bg-slate-950/40">
                <div id="drop-zone" onclick="document.getElementById('file-input').click()" class="border-2 border-dashed border-slate-700 hover:border-indigo-500 rounded-xl p-4 text-center cursor-pointer transition bg-slate-900/40 hover:bg-indigo-950/20 group">
                    <i data-lucide="upload-cloud" class="w-7 h-7 mx-auto text-slate-500 group-hover:text-indigo-400 mb-1 transition"></i>
                    <p class="text-xs text-slate-300 font-medium">책 사진 추가하기</p>
                    <p class="text-[10px] text-slate-500 mt-0.5">드래그 앤 드롭 또는 클릭</p>
                </div>
            </div>
        </div>

        <!-- CENTER / MAIN PANEL: Image Processing Canvas & Live Controls -->
        <div class="flex-1 bg-slate-950 flex flex-col h-full overflow-hidden">
            
            <!-- Filter Toolbar Controls -->
            <div class="bg-slate-900 border-b border-slate-800 p-3 flex flex-wrap items-center justify-between gap-3 text-xs z-10">
                
                <!-- Quick Mode Presets -->
                <div class="flex items-center space-x-1.5">
                    <span class="text-slate-400 font-medium mr-1">보정 모드:</span>
                    <button onclick="setMode('auto')" id="mode-btn-auto" class="px-2.5 py-1 rounded-md border font-medium transition flex items-center space-x-1 bg-indigo-600 border-indigo-500 text-white">
                        <i data-lucide="wand-2" class="w-3.5 h-3.5"></i>
                        <span>자동 흑백/대비</span>
                    </button>
                    <button onclick="setMode('grayscale')" id="mode-btn-grayscale" class="px-2.5 py-1 rounded-md border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
                        <span>그레이스케일</span>
                    </button>
                    <button onclick="setMode('color')" id="mode-btn-color" class="px-2.5 py-1 rounded-md border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
                        <span>컬러 원본</span>
                    </button>
                </div>

                <!-- Rotation & Reset Buttons -->
                <div class="flex items-center space-x-2">
                    <div class="flex rounded-lg bg-slate-800 border border-slate-700 p-0.5">
                        <button onclick="rotateCurrentPage(-90)" class="p-1 hover:bg-slate-700 text-slate-300 rounded" title="반시계 90도 회전">
                            <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                        </button>
                        <button onclick="rotateCurrentPage(90)" class="p-1 hover:bg-slate-700 text-slate-300 rounded" title="시계 90도 회전">
                            <i data-lucide="rotate-cw" class="w-4 h-4"></i>
                        </button>
                    </div>

                    <button onclick="resetCurrentFilters()" class="px-2.5 py-1 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-slate-200 border border-slate-700 transition flex items-center space-x-1" title="필터 초기화">
                        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                        <span>초기화</span>
                    </button>
                </div>
            </div>

            <!-- Fine-Tuning Sliders Bar -->
            <div class="bg-slate-900/60 border-b border-slate-800 px-4 py-2.5 grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
                <!-- Brightness Slider -->
                <div class="flex items-center space-x-2">
                    <span class="text-slate-400 w-12 shrink-0">밝기</span>
                    <input type="range" id="slider-brightness" min="-100" max="100" value="0" oninput="updateFilterFromSliders()" class="w-full accent-indigo-500 bg-slate-800 h-1.5 rounded-lg">
                    <span id="val-brightness" class="font-mono text-slate-400 w-8 text-right">0</span>
                </div>

                <!-- Contrast Slider -->
                <div class="flex items-center space-x-2">
                    <span class="text-slate-400 w-12 shrink-0">대비</span>
                    <input type="range" id="slider-contrast" min="-100" max="100" value="35" oninput="updateFilterFromSliders()" class="w-full accent-indigo-500 bg-slate-800 h-1.5 rounded-lg">
                    <span id="val-contrast" class="font-mono text-slate-400 w-8 text-right">35</span>
                </div>

                <!-- Threshold Slider -->
                <div class="flex items-center space-x-2">
                    <span class="text-slate-400 w-14 shrink-0">선명도</span>
                    <input type="range" id="slider-threshold" min="50" max="220" value="140" oninput="updateFilterFromSliders()" class="w-full accent-indigo-500 bg-slate-800 h-1.5 rounded-lg">
                    <span id="val-threshold" class="font-mono text-slate-400 w-8 text-right">140</span>
                </div>
            </div>

            <!-- Live Canvas Image Display -->
            <div class="flex-1 p-4 md:p-8 flex items-center justify-center checker-bg overflow-auto relative">
                <div class="relative max-h-full max-w-full flex items-center justify-center shadow-2xl rounded-lg overflow-hidden border border-slate-700/60">
                    <canvas id="main-canvas" class="max-h-[calc(100vh-250px)] max-w-full object-contain"></canvas>
                </div>

                <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950 text-slate-500 p-6 text-center">
                    <div class="w-16 h-16 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center mb-4 text-slate-600">
                        <i data-lucide="image" class="w-8 h-8"></i>
                    </div>
                    <p class="text-sm font-semibold text-slate-300">스캔한 책 사진을 올리세요</p>
                    <p class="text-xs text-slate-500 mt-1 max-w-sm">그림자와 누런 종이 바탕이 제거되고, 글씨와 도표가 선명해진 고화질 PDF로 생성됩니다.</p>
                </div>
            </div>

            <!-- Bottom PDF Export Setting Bar -->
            <div class="h-14 bg-slate-900 border-t border-slate-800 px-4 flex items-center justify-between text-xs">
                <div class="flex items-center space-x-3">
                    <label class="flex items-center space-x-1.5">
                        <span class="text-slate-400">PDF 파일명:</span>
                        <input type="text" id="pdf-filename" value="스캔도서_보정본" class="bg-slate-800 border border-slate-700 text-slate-200 px-2.5 py-1 rounded text-xs focus:outline-none focus:border-indigo-500 w-36 sm:w-48">
                    </label>

                    <label class="hidden sm:flex items-center space-x-1.5">
                        <span class="text-slate-400">용지 규격:</span>
                        <select id="pdf-paper-size" class="bg-slate-800 border border-slate-700 text-slate-200 px-2 py-1 rounded text-xs focus:outline-none">
                            <option value="a4">A4 규격 자동 맞춤</option>
                            <option value="original">사진 원본 비율 유지</option>
                        </select>
                    </label>
                </div>

                <div class="text-slate-400 text-[11px] flex items-center space-x-1">
                    <i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-400"></i>
                    <span>원본 텍스트·도표 100% 손실 없음</span>
                </div>
            </div>

        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center hidden">
        <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p id="loading-title" class="text-sm font-semibold text-slate-200">고화질 PDF 묶음 생성 중...</p>
        <p id="loading-sub" class="text-xs text-slate-400 mt-1">페이지 이미지를 고해상도로 변환하고 있습니다.</p>
    </div>

    <!-- JavaScript Application Code -->
    <script>
        /* State Management */
        const state = {
            pages: [], // List of { id, imgElement, rotation, mode, brightness, contrast, threshold }
            activePageIndex: 0
        };

        window.onload = function() {
            lucide.createIcons();
            setupDragAndDrop();
            loadSampleScanBook();
        };

        /* Drag & Drop Setup */
        function setupDragAndDrop() {
            const dropZone = document.getElementById('drop-zone');

            ['dragenter', 'dragover'].forEach(eventName => {
                dropZone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    dropZone.classList.add('border-indigo-500', 'bg-indigo-950/30');
                }, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    dropZone.classList.remove('border-indigo-500', 'bg-indigo-950/30');
                }, false);
            });

            dropZone.addEventListener('drop', (e) => {
                const files = e.dataTransfer.files;
                if (files.length) handleFiles(files);
            });
        }

        /* Sample Book Generator */
        function loadSampleScanBook() {
            state.pages = [];

            // Generate synthetic scanned page with graphics & formulas
            const c1 = createSamplePageCanvas('제 1 장: 스캔 이미지 고화질 보정', [
                '■ 본 방식은 AI 텍스트 추출 방식이 아닌, 사진을 깨끗하게 다듬는 방식입니다.',
                '■ 아래 화학식과 도표처럼 복잡한 원본 그대로 100% 보증되어 PDF에 저장됩니다.',
                '----------------------------------------------------------',
                ' [화학 반응식 예시]',
                '  2H₂ + O₂  ===>  2H₂O  (ΔH = -285.8 kJ/mol)',
                '  C₆H₁₂O₆ + 6O₂  ===>  6CO₂ + 6H₂O + Energy',
                '----------------------------------------------------------',
                '■ 누런 종이 빛깔과 어두운 조명 그림자가 클릭 한 번으로 제거됩니다.'
            ]);

            const c2 = createSamplePageCanvas('제 2 장: 도표 및 수학 공식 보존 테스트', [
                ' [수학 삼각함수 공식]',
                '   sin²(x) + cos²(x) = 1',
                '   e^(iπ) + 1 = 0',
                '----------------------------------------------------------',
                ' [실험데이터 통계 표]',
                ' ---------------------------------------------',
                '  구분     |   측정값(A)   |   보정값(B)   |  비고',
                ' ---------------------------------------------',
                '  1차 시도 |    98.4%      |    99.9%      | 정상',
                '  2차 시도 |    97.1%      |    99.8%      | 정상',
                ' ---------------------------------------------'
            ]);

            const img1 = new Image();
            img1.onload = () => {
                state.pages.push({
                    id: 'sample-1',
                    imgElement: img1,
                    rotation: 0,
                    mode: 'auto',
                    brightness: 0,
                    contrast: 35,
                    threshold: 140
                });
                const img2 = new Image();
                img2.onload = () => {
                    state.pages.push({
                        id: 'sample-2',
                        imgElement: img2,
                        rotation: 0,
                        mode: 'auto',
                        brightness: 0,
                        contrast: 35,
                        threshold: 140
                    });
                    state.activePageIndex = 0;
                    renderApp();
                };
                img2.src = c2.toDataURL();
            };
            img1.src = c1.toDataURL();
        }

        function createSamplePageCanvas(title, lines) {
            const canvas = document.createElement('canvas');
            canvas.width = 700;
            canvas.height = 950;
            const ctx = canvas.getContext('2d');

            // Simulate yellowish shadow paper
            const grad = ctx.createLinearGradient(0, 0, 700, 950);
            grad.addColorStop(0, '#f2ebd9');
            grad.addColorStop(1, '#dfd3b5');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 700, 950);

            // Add subtle shadow vignette
            ctx.fillStyle = 'rgba(60,40,10,0.12)';
            ctx.beginPath();
            ctx.arc(350, 475, 450, 0, Math.PI * 2);
            ctx.fill();

            // Text content
            ctx.fillStyle = '#221a0f';
            ctx.font = 'bold 22px "Noto Sans KR", sans-serif';
            ctx.fillText(title, 50, 80);

            ctx.font = '15px monospace';
            let y = 140;
            lines.forEach(line => {
                ctx.fillText(line, 50, y);
                y += 35;
            });

            ctx.font = '12px sans-serif';
            ctx.fillStyle = '#786851';
            ctx.fillText('- ScanBook Studio Image Bundle Demo -', 230, 900);

            return canvas;
        }

        /* Image File Upload Handling */
        function handleFileUpload(e) {
            if (e.target.files) handleFiles(e.target.files);
        }

        function handleFiles(files) {
            const imageFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
            if (!imageFiles.length) return;

            let count = 0;
            imageFiles.forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        state.pages.push({
                            id: 'page-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4),
                            imgElement: img,
                            rotation: 0,
                            mode: 'auto',
                            brightness: 0,
                            contrast: 35,
                            threshold: 140
                        });
                        count++;
                        if (count === imageFiles.length) {
                            state.activePageIndex = state.pages.length - count;
                            renderApp();
                        }
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        /* Render Main App UI */
        function renderApp() {
            renderThumbnails();
            renderMainCanvas();
            updateControlInputs();
            lucide.createIcons();
        }

        /* Thumbnails Panel Rendering */
        function renderThumbnails() {
            const listEl = document.getElementById('thumbnail-list');
            document.getElementById('total-page-count').innerText = state.pages.length;
            listEl.innerHTML = '';

            if (state.pages.length === 0) {
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            } else {
                document.getElementById('empty-state').classList.add('hidden');
            }

            state.pages.forEach((page, index) => {
                const isActive = index === state.activePageIndex;
                const card = document.createElement('div');
                card.className = `relative flex items-center space-x-3 p-2 rounded-xl border transition cursor-pointer group ${
                    isActive ? 'bg-indigo-950/40 border-indigo-500 ring-1 ring-indigo-500/50' : 'bg-slate-900 border-slate-800 hover:border-slate-700'
                }`;
                card.onclick = () => {
                    state.activePageIndex = index;
                    renderApp();
                };

                // Canvas mini thumbnail
                const miniCanvas = processImageCanvas(page, 120);

                card.innerHTML = `
                    <div class="w-12 h-16 bg-slate-950 rounded overflow-hidden flex items-center justify-center shrink-0 border border-slate-800">
                        <img src="${miniCanvas.toDataURL()}" class="max-w-full max-h-full object-contain">
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-xs font-semibold text-slate-200">페이지 ${index + 1}</p>
                        <p class="text-[10px] text-slate-500 truncate mt-0.5">${page.mode === 'auto' ? '자동 흑백 보정' : page.mode}</p>
                    </div>
                    <div class="flex flex-col space-y-1 opacity-60 group-hover:opacity-100 transition">
                        <button onclick="event.stopPropagation(); movePage(${index}, -1)" class="p-0.5 hover:text-indigo-400 text-slate-400 ${index === 0 ? 'invisible' : ''}"><i data-lucide="chevron-up" class="w-3.5 h-3.5"></i></button>
                        <button onclick="event.stopPropagation(); movePage(${index}, 1)" class="p-0.5 hover:text-indigo-400 text-slate-400 ${index === state.pages.length - 1 ? 'invisible' : ''}"><i data-lucide="chevron-down" class="w-3.5 h-3.5"></i></button>
                        <button onclick="event.stopPropagation(); deletePage(${index})" class="p-0.5 hover:text-rose-400 text-slate-400" title="삭제"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        function movePage(index, dir) {
            const target = index + dir;
            if (target < 0 || target >= state.pages.length) return;
            const temp = state.pages[index];
            state.pages[index] = state.pages[target];
            state.pages[target] = temp;
            state.activePageIndex = target;
            renderApp();
        }

        function deletePage(index) {
            state.pages.splice(index, 1);
            if (state.activePageIndex >= state.pages.length) {
                state.activePageIndex = Math.max(0, state.pages.length - 1);
            }
            renderApp();
        }

        function clearAllPages() {
            if (state.pages.length && confirm('모든 스캔 페이지를 삭제하시겠습니까?')) {
                state.pages = [];
                state.activePageIndex = 0;
                renderApp();
            }
        }

        /* Main Processing Canvas Rendering */
        function renderMainCanvas() {
            const page = state.pages[state.activePageIndex];
            const canvas = document.getElementById('main-canvas');
            if (!page) {
                canvas.width = 0;
                canvas.height = 0;
                return;
            }

            const processedCanvas = processImageCanvas(page);
            canvas.width = processedCanvas.width;
            canvas.height = processedCanvas.height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(processedCanvas, 0, 0);
        }

        /* Core Image Filter Processor (Fast JS Pixel Manipulation) */
        function processImageCanvas(page, maxThumbWidth = null) {
            const img = page.imgElement;
            const rotation = page.rotation || 0;
            const isRotatedQuarter = (rotation / 90) % 2 !== 0;

            let srcWidth = isRotatedQuarter ? img.height : img.width;
            let srcHeight = isRotatedQuarter ? img.width : img.height;

            let scale = 1;
            if (maxThumbWidth && srcWidth > maxThumbWidth) {
                scale = maxThumbWidth / srcWidth;
            }

            const width = Math.round(srcWidth * scale);
            const height = Math.round(srcHeight * scale);

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            // Rotation transform
            ctx.save();
            ctx.translate(width / 2, height / 2);
            ctx.rotate((rotation * Math.PI) / 180);
            if (isRotatedQuarter) {
                ctx.drawImage(img, -height / 2, -width / 2, height, width);
            } else {
                ctx.drawImage(img, -width / 2, -height / 2, width, height);
            }
            ctx.restore();

            if (page.mode === 'color' && page.brightness === 0 && page.contrast === 0) {
                return canvas; // Return raw color
            }

            // Pixel adjustment pipeline
            const imgData = ctx.getImageData(0, 0, width, height);
            const d = imgData.data;

            const b = parseInt(page.brightness || 0);
            const c = parseInt(page.contrast || 0);
            const factor = (259 * (c + 255)) / (255 * (259 - c));
            const thresh = parseInt(page.threshold || 140);
            const mode = page.mode || 'auto';

            for (let i = 0; i < d.length; i += 4) {
                let r = d[i];
                let g = d[i + 1];
                let bVal = d[i + 2];

                // Contrast & Brightness adjustment
                if (c !== 0 || b !== 0) {
                    r = factor * (r - 128) + 128 + b;
                    g = factor * (g - 128) + 128 + b;
                    bVal = factor * (bVal - 128) + 128 + b;
                }

                const gray = 0.299 * r + 0.587 * g + 0.114 * bVal;

                if (mode === 'grayscale') {
                    d[i] = d[i + 1] = d[i + 2] = Math.min(255, Math.max(0, gray));
                } else if (mode === 'auto') {
                    // Smart Document Binarization (Whiten yellow paper background, crisp text/graphics)
                    let v;
                    if (gray > thresh) {
                        v = 255; // Remove yellow shadow background completely to clean white
                    } else {
                        // Deepen dark text & drawings
                        v = Math.max(0, (gray / thresh) * 210 - 25);
                    }
                    d[i] = d[i + 1] = d[i + 2] = v;
                } else { // Color mode with brightness/contrast
                    d[i] = Math.min(255, Math.max(0, r));
                    d[i + 1] = Math.min(255, Math.max(0, g));
                    d[i + 2] = Math.min(255, Math.max(0, bVal));
                }
            }

            ctx.putImageData(imgData, 0, 0);
            return canvas;
        }

        /* Filter Controls Sync */
        function updateControlInputs() {
            const page = state.pages[state.activePageIndex];
            if (!page) return;

            document.getElementById('slider-brightness').value = page.brightness;
            document.getElementById('slider-contrast').value = page.contrast;
            document.getElementById('slider-threshold').value = page.threshold;

            document.getElementById('val-brightness').innerText = page.brightness;
            document.getElementById('val-contrast').innerText = page.contrast;
            document.getElementById('val-threshold').innerText = page.threshold;

            // Update mode buttons state
            ['auto', 'grayscale', 'color'].forEach(m => {
                const btn = document.getElementById(`mode-btn-${m}`);
                if (page.mode === m) {
                    btn.className = "px-2.5 py-1 rounded-md border font-medium transition flex items-center space-x-1 bg-indigo-600 border-indigo-500 text-white";
                } else {
                    btn.className = "px-2.5 py-1 rounded-md border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
                }
            });
        }

        function setMode(modeName) {
            const page = state.pages[state.activePageIndex];
            if (page) {
                page.mode = modeName;
                renderApp();
            }
        }

        function rotateCurrentPage(deg) {
            const page = state.pages[state.activePageIndex];
            if (page) {
                page.rotation = (page.rotation + deg + 360) % 360;
                renderApp();
            }
        }

        function updateFilterFromSliders() {
            const page = state.pages[state.activePageIndex];
            if (!page) return;

            page.brightness = parseInt(document.getElementById('slider-brightness').value);
            page.contrast = parseInt(document.getElementById('slider-contrast').value);
            page.threshold = parseInt(document.getElementById('slider-threshold').value);

            document.getElementById('val-brightness').innerText = page.brightness;
            document.getElementById('val-contrast').innerText = page.contrast;
            document.getElementById('val-threshold').innerText = page.threshold;

            renderMainCanvas();
            renderThumbnails();
        }

        function resetCurrentFilters() {
            const page = state.pages[state.activePageIndex];
            if (page) {
                page.brightness = 0;
                page.contrast = 35;
                page.threshold = 140;
                page.mode = 'auto';
                page.rotation = 0;
                renderApp();
            }
        }

        /* High Quality Image PDF Export Implementation */
        async function exportToPdfBundle() {
            if (!state.pages.length) {
                alert('PDF로 내보낼 스캔 사진을 등록하세요.');
                return;
            }

            const modal = document.getElementById('loading-modal');
            modal.classList.remove('hidden');

            // Allow UI to refresh before heavy canvas generation
            await new Promise(resolve => setTimeout(resolve, 100));

            try {
                const { jsPDF } = window.jspdf;
                const paperSizeOpt = document.getElementById('pdf-paper-size').value;
                const fileName = (document.getElementById('pdf-filename').value.trim() || 'ScanBook_Document') + '.pdf';

                let pdf = null;

                for (let i = 0; i < state.pages.length; i++) {
                    const pageCanvas = processImageCanvas(state.pages[i]);
                    const imgData = pageCanvas.toDataURL('image/jpeg', 0.92);

                    const imgW = pageCanvas.width;
                    const imgH = pageCanvas.height;

                    if (paperSizeOpt === 'original') {
                        // Keep exact picture dimension ratio
                        const orientation = imgW > imgH ? 'l' : 'p';
                        if (i === 0) {
                            pdf = new jsPDF({ orientation: orientation, unit: 'px', format: [imgW, imgH] });
                        } else {
                            pdf.addPage([imgW, imgH], orientation);
                        }
                        pdf.addImage(imgData, 'JPEG', 0, 0, imgW, imgH);
                    } else {
                        // Standard A4 Auto-Fit
                        const orientation = imgW > imgH ? 'l' : 'p';
                        if (i === 0) {
                            pdf = new jsPDF({ orientation: orientation, unit: 'mm', format: 'a4' });
                        } else {
                            pdf.addPage('a4', orientation);
                        }

                        const pdfW = pdf.internal.pageSize.getWidth();
                        const pdfH = pdf.internal.pageSize.getHeight();

                        const ratio = Math.min(pdfW / imgW, pdfH / imgH);
                        const renderW = imgW * ratio;
                        const renderH = imgH * ratio;

                        const posX = (pdfW - renderW) / 2;
                        const posY = (pdfH - renderH) / 2;

                        pdf.addImage(imgData, 'JPEG', posX, posY, renderW, renderH);
                    }
                }

                pdf.save(fileName);
            } catch (err) {
                alert('PDF 생성 중 오류가 발생했습니다: ' + err.message);
            } finally {
                modal.classList.add('hidden');
            }
        }
    </script>
