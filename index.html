<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScanBook AI - 스마트 디지털 텍스트 & PDF 변환기</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a'
            }
          }
        }
      }
    }
  </script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Marked (Markdown Parser) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- html2pdf.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    .pdf-template {
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      color: #1e293b;
      line-height: 1.6;
      background-color: #ffffff;
      padding: 40px;
      width: 800px;
      margin: 0 auto;
    }
    .pdf-template h1 {
      font-size: 26px;
      font-weight: 800;
      color: #1e3a8a;
      border-bottom: 3px solid #1e3a8a;
      padding-bottom: 8px;
      margin-top: 0;
      margin-bottom: 16px;
    }
    .pdf-template h2 {
      font-size: 18px;
      font-weight: 700;
      color: #1d4ed8;
      background-color: #eff6ff;
      padding: 8px 14px;
      border-left: 5px solid #2563eb;
      border-radius: 0 6px 6px 0;
      margin-top: 24px;
      margin-bottom: 12px;
    }
    .pdf-template h3 {
      font-size: 15px;
      font-weight: 700;
      color: #1e40af;
      margin-top: 16px;
      margin-bottom: 8px;
    }
    .pdf-template p {
      margin-bottom: 10px;
      font-size: 13.5px;
      word-break: keep-all;
    }
    .pdf-template ul, .pdf-template ol {
      margin-bottom: 12px;
      padding-left: 20px;
      font-size: 13.5px;
    }
    .pdf-template li {
      margin-bottom: 4px;
    }
    .pdf-template table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 12.5px;
    }
    .pdf-template th {
      background-color: #f1f5f9;
      color: #334155;
      font-weight: 700;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      text-align: left;
    }
    .pdf-template td {
      padding: 7px 12px;
      border: 1px solid #cbd5e1;
    }
    .pdf-template mark {
      background-color: #fef08a;
      color: #854d0e;
      padding: 2px 5px;
      border-radius: 3px;
      font-weight: 600;
    }
    .pdf-template blockquote {
      border-left: 4px solid #94a3b8;
      background-color: #f8fafc;
      padding: 10px 14px;
      margin: 12px 0;
      color: #475569;
      font-size: 13px;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-brand-500 selection:text-white">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-95
